function transcriptEvidence(mid,index){const m=meetingBy(mid),t=m.transcript[index];let existing=data.evidence.find(e=>e.meetingId===mid&&e.quote===t.text);if(existing)return existing;let id=`t-${mid}-${index}`;existing=data.evidence.find(e=>e.id===id);if(existing)return existing;let e={id,meetingId:mid,date:m.date,title:m.title,kind:'原始转写',speaker:t.speaker,time:t.time,quote:t.text,context:[m.transcript[index-1]?.text,m.transcript[index+1]?.text].filter(Boolean).join(' '),state:'来源已核验',note:'保留上下文'};data.evidence.push(e);return e}
function isTranscriptSelected(mid,i){const m=meetingBy(mid);let e=data.evidence.find(e=>e.meetingId===mid&&e.quote===m.transcript[i].text);return e&&state.selectedEvidence.has(e.id)}
function toggleTranscript(mid,i){let e=transcriptEvidence(mid,i);if(state.selectedEvidence.has(e.id)){state.selectedEvidence.delete(e.id);toast('已从问题材料移除该片段')}else{state.selectedEvidence.add(e.id);toast('已选取原文与上下文，可在底部继续整理')}state.verified=false;renderDetail();updateMaterialBar()}

function renderMaterials(){let step=state.materialStep,stats=materialStats();let progress=`<div class="material-progress" aria-label="整理进度">${['提出问题','选取材料','核验来源','导出'].map((s,i)=>`<div class="progress-step ${i===step?'active':i<step?'done':''}"><span class="step-number">${i<step?'✓':i+1}</span>${s}</div>`).join('')}</div>`;let body='',footer='';
 if(step===0){body=`<div class="field"><label for="materialQuestion">你想重新理解什么？</label><textarea id="materialQuestion" placeholder="例如：为什么把统一提醒调整为分级处理？">${esc(state.question)}</textarea><small>围绕一个具体问题，把历史原话整理成可继续分析的素材。</small></div><div class="section-label">从已有的问题开始</div>${data.questions.map(q=>`<button class="question-suggestion" data-question="${q.id}"><span><strong>${esc(q.title)}</strong><small>${esc(projectBy(q.projectId)?.name)} · ${esc(q.updated)}</small></span>${icon('arrow')}</button>`).join('')}`;footer=`<span>${stats.count?`保留已选的 ${stats.count} 段原文`:'可先选问题，再选择相关原文'}</span><button class="btn primary" data-action="material-next">开始选材 ${icon('arrow')}</button>`}
 if(step===1){let es=visibleEvidence();body=`<h3 class="question-title">${esc(state.question)}</h3><div class="materials-toolbar"><span>演示候选 · 按时间排列 · ${es.length} 段原文</span><button class="btn quiet" data-action="select-all">${es.every(e=>state.selectedEvidence.has(e.id))?'取消全选':'全选当前候选'}</button></div>${es.map(e=>`<label class="evidence-card ${state.selectedEvidence.has(e.id)?'selected':''}"><div class="evidence-top"><input type="checkbox" data-evidence="${e.id}" ${state.selectedEvidence.has(e.id)?'checked':''}><div><strong>${esc(e.title)}</strong><small>${dateShort(e.date)} · ${esc(e.speaker)} ${esc(e.time)} · ${esc(e.kind)}</small></div></div><blockquote>“${esc(e.quote)}”</blockquote><div class="evidence-context">上下文：${esc(e.context||'无更多上下文')}</div><div class="evidence-note"><span class="${e.note.includes('历史')?'historical':''}">${esc(e.note)}</span><span>${state.selectedEvidence.has(e.id)?'已选取':'点击选取'}</span></div></label>`).join('')}<p class="demo-inline">候选为演示预置素材；真实产品按问题检索。保留早期方案，也有助于理解后续变化。</p>`;footer=`<span>${stats.count} 段原文 · ${stats.meetings} 场会议 · 约 ${stats.chars} 字</span><div class="actions"><button class="btn" data-action="material-prev">返回</button><button class="btn primary" data-action="material-next" ${stats.count?'':'disabled'}>核验来源 ${icon('arrow')}</button></div>`}
 if(step===2){body=`<h3 class="question-title">${esc(state.question)}</h3><div class="verify-grid"><div class="verify-stat"><strong>${stats.count}</strong><small>原文片段</small></div><div class="verify-stat"><strong>${stats.meetings}</strong><small>关联会议</small></div><div class="verify-stat"><strong>${stats.chars}</strong><small>原文与上下文字数</small></div></div><div class="section-label">导出前的来源核对<span>当前演示数据</span></div>${['选取的原话仍能定位到对应会议','每段材料保留发言人、时间与上下文','早期方案与已调整的讨论保留历史标记'].map(x=>`<div class="check-row ${state.verified?'':'pending'}">${icon(state.verified?'check':'clock')}<span>${x}</span></div>`).join('')}<div class="verify-notice">${chosenEvidence().some(e=>e.note.includes('历史'))?'包含历史方案：仅供理解演变，不代表当前决定。':'这些原始转写尚不等同于人工确认的事实。'}<br>相关材料不一定完整；本次导出不自动生成问题结论。</div><div class="budget"><span>导出内容</span><select id="exportBudget" aria-label="导出内容"><option value="all" ${state.budget==='all'?'selected':''}>原文 + 完整上下文</option><option value="quotes" ${state.budget==='quotes'?'selected':''}>仅原文片段</option></select></div><p class="demo-inline" style="margin-top:12px">选取内容全部保留，不静默截断。${state.budget==='quotes'?'当前选择不包含上下文。':'建议保留上下文，便于其他 AI 理解原意。'}</p>`;footer=`<span>${state.verified?'演示核验完成 · 0 项异常':'尚未执行本轮演示核验'}</span><div class="actions"><button class="btn" data-action="material-prev">返回</button><button class="btn primary" data-action="${state.verified?'material-next':'verify'}">${state.verified?'查看导出':'模拟核验来源'} ${icon(state.verified?'arrow':'check')}</button></div>`}
 if(step===3){let md=makeMarkdown();body=`<div class="export-success">${icon('check')}材料已经整理好，可以交给另一位 AI 继续阅读。</div><h3 class="question-title">${esc(state.question)}</h3><p class="demo-inline">${stats.count} 段原文 · ${stats.meetings} 场会议 · 含来源索引和历史标记。输出不包含生成式结论。</p><pre class="export-preview">${esc(md)}</pre><p class="demo-inline">下载的是本页演示材料，保存为独立 Markdown 文件。</p>`;footer=`<span>可在其他 AI 或 Obsidian 中继续使用</span><div class="actions"><button class="btn" data-action="material-prev">返回</button><button class="btn primary" data-action="download">${icon('download')}下载 Markdown</button></div>`}
 showDialog('materials',modalHead('QUESTION MATERIALS · 问题材料','沿着一个问题，重读过去','选取原话，保留出处，把判断留给下一步。')+progress+`<div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer>`,true);updateMaterialBar();
}
function makeMarkdown(){let es=chosenEvidence(),stats=materialStats();return `---\ntitle: ${JSON.stringify(state.question)}\nkind: echo-question-materials\ndemo: true\nsource_count: ${stats.meetings}\nexcerpt_count: ${es.length}\ncontext_included: ${state.budget==='all'}\nverification: demo_verified\n---\n\n# ${state.question}\n\n> 交互原型演示材料。供进一步阅读与分析，不含自动生成的结论。\n> 材料可能不完整；原始转写可能有识别偏差。历史讨论不代表当前决定。\n\n## 选取范围\n\n- ${es.length} 段原始转写，来自 ${stats.meetings} 场会议。\n- ${state.budget==='all'?'保留原话及上下文。':'仅保留原话，未包含上下文。'}\n- 所有选取内容完整导出，没有静默截断。\n\n## 原始素材\n\n${es.map((e,i)=>`### ${i+1}. ${e.title}\n\n- 来源：${e.meetingId}\n- 片段：${e.id}\n- 会议日期：${e.date||'待补全'}\n- 发言人 / 时间：${e.speaker} / ${e.time}\n- 材料类型：${e.kind}\n- 历史说明：${e.note}\n- 核验：本页演示数据已核对（非真实源文件核验）\n\n> ${e.quote}\n${state.budget==='all'?`\n**上下文**\n\n${e.context||'未提供更多上下文。'}\n`:''}`).join('\n')}\n## 来源索引\n\n${[...new Set(es.map(e=>e.meetingId))].map(id=>{let m=meetingBy(id);return `- ${id} · ${m?.date||'日期待补全'} · ${m?.title||id}`}).join('\n')}\n\n## 留给后续解读\n\n- 区分早期设想、近期讨论与当前确认记忆。\n- 引用时注明具体会议与片段。\n- 资料不足时明确指出缺口，不补写未被材料支持的结论。\n`}
function downloadMD(){let blob=new Blob([makeMarkdown()],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Echo-Notes-问题材料-演示.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示 Markdown · 原话、上下文与来源已保留')}
function applyTheme(theme){if(theme!=='light'&&theme!=='dark')return;document.documentElement.dataset.theme=theme;$('themeButton').innerHTML=icon(theme==='light'?'moon':'sun');$('themeButton').setAttribute('aria-label',theme==='light'?'切换深色主题':'切换浅色主题')}
function jumpMeeting(id){let m=meetingBy(id);closeDialog();state.date=m.date||state.date;state.range='day';state.undated=!m.date;state.project='all';state.tag='all';state.search='';$('tagFilter').value='all';$('meetingSearch').value='';state.selected=id;state.tab='summary';state.mobileDetail=true;render();window.scrollTo({top:0,behavior:'smooth'})}
function handleAction(action){switch(action){
 case 'home':state.range='day';state.undated=false;state.project='all';state.tag='all';state.search='';state.mobileDetail=false;$('tagFilter').value='all';$('meetingSearch').value='';render();break;
 case 'theme':applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');break;
 case 'prev-day':setDate(shiftDate(state.date,state.range==='week'?-7:-1));break;case 'next-day':setDate(shiftDate(state.date,state.range==='week'?7:1));break;
 case 'today':state.range='day';setDate(data.today);break;case 'default-date':state.project='all';state.tag='all';state.search='';$('tagFilter').value='all';$('meetingSearch').value='';state.range='day';setDate(data.defaultDate);break;
 case 'calendar':openCalendar();break;case 'prev-month':case 'next-month':{let d=new Date(state.year,state.month+(action==='prev-month'?-1:1),1);state.year=d.getFullYear();state.month=d.getMonth();renderCalendar();break}
 case 'dated':state.undated=false;state.mobileDetail=false;render();break;case 'undated':state.undated=true;state.project='all';state.tag='all';state.search='';$('tagFilter').value='all';$('meetingSearch').value='';state.mobileDetail=false;render();break;
 case 'reset-filters':if(state.project==='all'&&state.tag==='all'&&!state.search){state.range='week';state.undated=false}else{state.project='all';state.tag='all';state.search='';$('tagFilter').value='all';$('meetingSearch').value=''}render();break;
 case 'back-list':state.mobileDetail=false;render();window.scrollTo({top:0,behavior:'smooth'});break;
 case 'native':openNative();break;case 'projects':openProjects();break;case 'project-note':showDialog('project-note',modalHead('OBSIDIAN · 模拟项目笔记',projectBy(state.projectId).name,'本页为演示笔记，未访问真实知识库。')+`<div class="modal-body native-note"><div class="native-path">项目 / ${esc(projectBy(state.projectId).name)}.md</div><h4>背景</h4><p>${esc(projectBy(state.projectId).background)}</p><h4>目标</h4><p>${esc(projectBy(state.projectId).goal)}</p><h4>当前进展</h4><p>${esc(projectBy(state.projectId).note)}</p></div><footer class="modal-footer"><span>项目笔记 · 演示</span><button class="btn" data-action="back-project">返回项目</button></footer>`);break;
 case 'back-project':openProject(state.projectId);break;case 'filter-project':closeDialog();state.project=state.projectId;state.range='all';state.undated=false;state.mobileDetail=false;render();toast('已显示该项目跨日期的全部会议');break;
 case 'fix-date':openDateFix();break;case 'save-date':saveDate();break;case 'link-project':openLinkProject();break;
 case 'retry':{let m=meetingBy(state.selected);m.status='complete';m.summary='演示重新处理已完成。当前没有额外转写素材。';m.keypoints=['此状态变化仅在当前演示页面中生效。'];renderDetail();toast('模拟重新转写完成 · 未处理真实录音');break}
 case 'close':closeDialog();break;case 'agent':openAgent();break;case 'toggle-agent':state.connected=!state.connected;$('agentButton').innerHTML=icon('agent')+(state.connected?'已模拟连接':'Agent');openAgent();break;
 case 'materials':startMaterials();break;case 'material-prev':state.materialStep=Math.max(0,state.materialStep-1);renderMaterials();break;
 case 'material-next':if(state.materialStep===0){let q=$('materialQuestion').value.trim();if(!q){$('materialQuestion').focus();toast('先写下你想理解的具体问题');return}state.question=q;state.verified=false}if(state.materialStep===1&&!state.selectedEvidence.size){toast('至少选择一段原文');return}state.materialStep=Math.min(3,state.materialStep+1);renderMaterials();break;
 case 'select-all':{let es=visibleEvidence(),all=es.every(e=>state.selectedEvidence.has(e.id));for(let e of es){if(all)state.selectedEvidence.delete(e.id);else state.selectedEvidence.add(e.id)}state.verified=false;renderMaterials();break}
 case 'verify':state.verified=true;renderMaterials();toast('演示核验完成：片段、来源与上下文均可定位');break;case 'download':downloadMD();break;
}}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(button){if(button.disabled)return;if(button.dataset.action)handleAction(button.dataset.action);else if(button.dataset.meeting){state.selected=button.dataset.meeting;state.tab='summary';state.mobileDetail=true;render();if(window.innerWidth<=600)window.scrollTo({top:0,behavior:'smooth'})}else if(button.dataset.project){state.project=button.dataset.project;state.mobileDetail=false;render()}else if(button.dataset.tab){state.tab=button.dataset.tab;renderDetail()}else if(button.dataset.tag){state.tag=button.dataset.tag;$('tagFilter').value=state.tag;state.mobileDetail=false;render()}else if(button.dataset.date)setDate(button.dataset.date);else if(button.dataset.openProject)openProject(button.dataset.openProject);else if(button.dataset.jumpMeeting)jumpMeeting(button.dataset.jumpMeeting);else if(button.dataset.take){let [mid,i]=button.dataset.take.split(':');toggleTranscript(mid,Number(i))}else if(button.dataset.agent){state.agent=button.dataset.agent;state.connected=false;$('agentButton').innerHTML=icon('agent')+'Agent';openAgent()}else if(button.dataset.question){let q=data.questions.find(q=>q.id===button.dataset.question);state.question=q.title;state.materialStep=1;state.verified=false;renderMaterials()}else if(button.dataset.linkProject){meetingBy(state.selected).projectIds.push(button.dataset.linkProject);closeDialog();renderDetail();toast('已在演示中关联项目')}}if(!$('calendarPopover').hidden&&!e.target.closest('.date-controls'))closeCalendar()});
document.addEventListener('change',e=>{if(e.target.id==='dateRange'){state.range=e.target.value;state.undated=false;state.mobileDetail=false;render()}if(e.target.id==='tagFilter'){state.tag=e.target.value;state.mobileDetail=false;render()}if(e.target.dataset.evidence){e.target.checked?state.selectedEvidence.add(e.target.dataset.evidence):state.selectedEvidence.delete(e.target.dataset.evidence);state.verified=false;let scroll=$('dialog').querySelector('.modal-body').scrollTop;renderMaterials();$('dialog').querySelector('.modal-body').scrollTop=scroll;renderDetail()}if(e.target.id==='exportBudget'){state.budget=e.target.value;renderMaterials()}});
$('meetingSearch').addEventListener('input',e=>{state.search=e.target.value;state.mobileDetail=false;render()});
$('homeLink').addEventListener('click',e=>{e.preventDefault();handleAction('home')});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
$('dialog').addEventListener('cancel',()=>{state.modal=null;setTimeout(()=>lastFocus?.focus?.(),0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('calendarPopover').hidden){closeCalendar();$('calendarButton').focus()}});
window.addEventListener('message',e=>{if(e.data?.type==='echo-theme')applyTheme(e.data.theme)});
$('brandIcon').innerHTML=icon('echo');$('prevDay').innerHTML=icon('chevronLeft');$('nextDay').innerHTML=icon('chevronRight');$('calendarButton').innerHTML=icon('calendar');$('searchIcon').innerHTML=icon('search');$('materialIcon').innerHTML=icon('materials');['arrow1','arrow2','arrow3','barArrow'].forEach(id=>$(id).innerHTML=icon('arrow'));$('agentButton').innerHTML=icon('agent')+'Agent';
$('tagFilter').innerHTML='<option value="all">全部标签</option>'+[...new Set(data.meetings.flatMap(m=>m.tags))].map(t=>`<option value="${esc(t)}"># ${esc(t)}</option>`).join('');
applyTheme('light');render();
</script>
</body>
</html>
